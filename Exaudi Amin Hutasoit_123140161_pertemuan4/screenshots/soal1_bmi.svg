    <text x="0" y="0" class="prompt">PS C:\Tugas Praktikum\Exaudi Amin Hutasoit_123140161_pertemuan4&gt; <tspan class="cmd">python tugas1_bmi.py</tspan></text>

    <!-- Banner -->
    <text x="0" y="30" class="text-cyan">============================================================</text>
    <text x="0" y="50" class="text-bold">      PROGRAM KALKULATOR BODY MASS INDEX (BMI) ITERA</text>
    <text x="0" y="70" class="text-cyan">============================================================</text>
    <text x="0" y="90" class="text-main">Nama Praktikan : <tspan class="text-green">Exaudi Amin Hutasoit</tspan></text>
    <text x="0" y="110" class="text-main">NIM            : <tspan class="text-yellow">123140161</tspan></text>
    <text x="0" y="130" class="text-dim">------------------------------------------------------------</text>

    <!-- User Input Simulation -->
    <text x="0" y="155" class="text-main">Masukkan berat badan Anda (kg) : <tspan class="text-green">65</tspan></text>
    <text x="0" y="175" class="text-main">Masukkan tinggi badan Anda (m)  : <tspan class="text-green">1.72</tspan></text>

    <!-- Result Box -->
    <text x="0" y="210" class="text-cyan">============================================================</text>
    <text x="0" y="230" class="text-bold">                  HASIL EVALUASI BMI</text>
    <text x="0" y="250" class="text-cyan">============================================================</text>
    <text x="0" y="270" class="text-main">Berat Badan      : 65.0 kg</text>
    <text x="0" y="290" class="text-main">Tinggi Badan     : 1.72 m</text>
    <text x="0" y="310" class="text-main">Nilai BMI        : <tspan class="text-yellow">21.97</tspan></text>
    <text x="0" y="330" class="text-main">Kategori Status  : <tspan class="text-green">Berat badan normal</tspan></text>
    <text x="0" y="350" class="text-main">Rekomendasi      : Pertahankan pola makan bergizi dan gaya hidup aktif secara konsisten.</text>
    <text x="0" y="370" class="text-cyan">============================================================</text>

    <text x="0" y="405" class="prompt">PS C:\Tugas Praktikum\Exaudi Amin Hutasoit_123140161_pertemuan4&gt; <tspan class="text-dim">_</tspan></text>
