<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style>
      .window-bg { fill: #1e1e2e; rx: 12px; }
      .header-bg { fill: #181825; rx: 12px; }
      .btn-red { fill: #f38ba8; }
      .btn-yellow { fill: #f9e2af; }
      .btn-green { fill: #a6e3a1; }
      .title { fill: #cdd6f4; font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .prompt { fill: #89b4fa; font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; font-weight: bold; }
      .cmd { fill: #f5e0dc; font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; }
      .text-dim { fill: #6c7086; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; }
      .text-main { fill: #cdd6f4; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; }
      .text-bold { fill: #cdd6f4; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; font-weight: bold; }
      .text-cyan { fill: #89dceb; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; font-weight: bold; }
      .text-green { fill: #a6e3a1; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; font-weight: bold; }
      .text-yellow { fill: #f9e2af; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="880" height="500" class="window-bg" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.5))"/>
  <path d="M 0,12 C 0,5.37 5.37,0 12,0 L 868,0 C 874.63,0 880,5.37 880,12 L 880,40 L 0,40 Z" class="header-bg"/>

  <!-- Window Controls -->
  <circle cx="24" cy="20" r="6.5" class="btn-red"/>
  <circle cx="44" cy="20" r="6.5" class="btn-yellow"/>
  <circle cx="64" cy="20" r="6.5" class="btn-green"/>

  <!-- Title -->
  <text x="440" y="25" class="title">Terminal — PowerShell (python tugas1_bmi.py)</text>

  <!-- Terminal Content -->
  <g transform="translate(25, 70)">
